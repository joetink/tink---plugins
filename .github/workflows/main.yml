name: Build Tink Plugins to WASM

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - run: mkdir -p dist/jsfx && cp -r jsfx dist/
      - uses: actions/upload-artifact@v4
        with:
          name: tink-plugins-dist
          path: dist
